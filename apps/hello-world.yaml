apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: hello
spec:
  project: default

  source:
    repoURL: https://github.com/markusryoti/gitops.git
    targetRevision: main
    path: environments/charts/hello-world

  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
